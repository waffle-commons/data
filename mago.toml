# Mago Configuration - Waffle Commons (Data, Beta 0)
# For full documentation, see https://mago.carthage.software/tools/overview
php-version = "8.5.5"

[source]
paths = ["src/", "tests/"]
includes = ["vendor"]
excludes = []

# -----------------------------------------------------------------------------
# Mago Guard — Beta 0 standardized architectural perimeter
# -----------------------------------------------------------------------------
# By default a new component depends only on `waffle-commons/contracts`. Edit
# the `permit` list below if your component legitimately requires another
# waffle-commons package (and declare the dependency in composer.json).
[guard]
mode = "default"
excludes = ["tests/bootstrap.php"]

[guard.perimeter]
layering = ["Waffle", "WaffleTests"]

[guard.perimeter.layers]
core = ["@global", "Psl\\**"]
psr = ["Psr\\**"]

[[guard.perimeter.rules]]
namespace = "Waffle\\Commons\\Data"
permit = [
    "Waffle\\Commons\\Data\\**",
    "Waffle\\Commons\\Contracts\\**",
    # PHP's MongoDB driver extension lives in a namespaced (non-global) root;
    # it is a backend driver dependency exactly like the global PDO/Redis
    # classes, scoped to the Driver\Mongo adapter.
    "MongoDB\\**",
    "@layer:core",
    "@layer:psr",
]

[[guard.perimeter.rules]]
namespace = "WaffleTests\\Commons\\Data"
permit = ["@all"]

[[guard.structural.rules]]
on = "Waffle\\Commons\\**"
target = "interface"
must-be-named = "*Interface"
reason = "Interfaces must follow the waffle-commons *Interface convention."

[[guard.structural.rules]]
on = "Waffle\\Commons\\**\\Enum\\**"
must-be = ["enum"]
reason = "Reserved namespace: only enum declarations are permitted here."

[[guard.structural.rules]]
on = "Waffle\\Commons\\**\\Exception\\**"
target = "class"
must-be-named = "*Exception"
reason = "Exception classes must follow the *Exception naming convention."

[formatter]
print-width = 120
tab-width = 4
use-tabs = false
single-quote = true
trailing-comma = true
end-of-line = "lf"

[linter]
# Zero-Baseline policy (Beta 0): no `baseline = ...` is permitted.
integrations = ["phpunit"]

[linter.rules]
# Security - Zero tolerance
no-insecure-comparison = { level = "error" }
no-literal-password = { level = "error" }
no-debug-symbols = { level = "error" }
disallowed-functions = { level = "error", functions = ["eval", "exec", "system", "shell_exec", "passthru", "phpinfo"] }

# Code quality - Strict
prefer-interface = { level = "error" }
strict-types = { level = "error" }
# NOTE: the template's `property-type` / `return-type` linter rules were removed:
# they are not recognised by the pinned mago 1.29.0 (they break config parsing)
# and are already enforced natively by the strict `[analyzer]` block below
# (untyped properties/returns surface as `mixed-*` analyzer errors).

# -----------------------------------------------------------------------------
# Opinionated style / software-metric rules disabled project-wide. This mirrors
# the curated set every shipped Waffle component already uses (see cache &
# contracts): these are stylistic or metric heuristics, not correctness checks —
# correctness is enforced by the strict `[analyzer]` block below.
# -----------------------------------------------------------------------------
assertion-style = { enabled = false }
assert-description = { enabled = false }
literal-named-argument = { enabled = false }
no-boolean-flag-parameter = { enabled = false }
too-many-methods = { enabled = false }
cyclomatic-complexity = { enabled = false }
single-class-per-file = { enabled = false }
prefer-arrow-function = { enabled = false }
no-redundant-nullsafe = { enabled = false }
# Disabled: the connection pool's reset path deliberately swallows a rollback
# failure on an already-dead socket (the handle is culled by the next
# ping-before-dispense probe). There is no logger in this contracts-only
# component, so the catch is intentionally a no-op with an explanatory comment.
no-empty-catch-clause = { enabled = false }

[analyzer]
# Zero-Baseline policy (Beta 0): no `baseline = ...` is permitted.
find-unused-definitions = true
find-unused-expressions = true
analyze-dead-code = true
check-throws = true
strict-list-index-checks = true
strict-array-index-existence = true
ignore = [
    # The hydrator instantiates the caller-supplied DTO class dynamically — that
    # is its entire purpose, so the concrete class cannot be resolved statically.
    { code = "unknown-class-instantiation", in = ["src/Hydrator/PropertyHookHydrator.php"] },
    # `check-throws` is a production-code discipline. In test methods, PHPUnit's
    # own assertion exceptions (ExpectationFailedException, …) and the driver
    # exceptions a test deliberately lets bubble to PHPUnit would otherwise force
    # a `@throws` tag on every single test — noise, not safety. Scoped to tests/.
    { code = "unhandled-thrown-type", in = ["tests/"] },
    # These four files are the component's untyped-backend boundary —
    # `json_decode()`, `PDOStatement::fetch()`, phpredis, and the GraphQL/Mongo
    # wire payloads are `mixed` by signature. Every value is narrowed by an
    # `is_array()` / `is_scalar()` / `is_string()` guard before any use, and a
    # shape violation throws a DatabaseException (poisoned-row rejection), so
    # the `mixed` never escapes these files.
    { code = "mixed-assignment", in = [
        "src/Hydrator/RowNormaliser.php",
        "src/Driver/KeyValue/RedisKeyValueClient.php",
        "src/Driver/Graph/GraphQLExecutor.php",
        "src/Driver/Mongo/MongoDriverSession.php",
    ] },
]
